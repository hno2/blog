# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
         lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Requirements
        run:  uv sync --no-dev
      - name: Build HTML
        run: uv run pelican -s publishconf.py content
      - name: Set up deploy SSH key
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PRIVATE_KEY: ${{ secrets.REMOTE_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          key_file=~/.ssh/deploy_key

          if printf '%s' "$REMOTE_PRIVATE_KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$REMOTE_PRIVATE_KEY" | perl -0pe 's/\r\n?/\n/g; s/\\n/\n/g' > "$key_file"
          else
            printf '%s' "$REMOTE_PRIVATE_KEY" | tr -d '\r\n' | base64 --decode > "$key_file"
          fi

          chmod 600 "$key_file"
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy to new Server
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./output/ "$REMOTE_USER@$REMOTE_HOST:/var/www/simonklug.de/"
